name: Tests

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_PROGRESS_BAR: "off"

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    # uv selects a pre-release only while no final release matches the request,
    # so 3.15 runs against 3.15.0rc today and against 3.15.0 from 2026-10-01 on.
    # The release does not make the leg blocking: failures stay tolerated until
    # the experimental flag is removed here, which is due once we consider 3.15
    # supported (issue #384).
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        experimental:
        - false
        include:
        - python-version: '3.15'
          experimental: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # The full history is required for sphinx_sitemap
        fetch-depth: 0

    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    # Dependencies are resolved fresh on every run so that the matrix keeps
    # catching upstream releases that break voc4cat.
    - name: Install dependencies
      run: |
        uv sync
        uv run python -VV

    # pyLODE is an optional runtime dependency; our 2.x fork is not on PyPI and
    # is therefore layered on top of the environment just for this run.
    - name: Run tests & collect coverage
      run: |
        uv run --with git+https://github.com/dalito/pyLODE.git@nfdi4cat-2.x coverage run -p -m pytest

    - name: Upload coverage data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        include-hidden-files: true
        name: coverage-data-${{ matrix.python-version }}
        path: .coverage.*

    - name: Build Sphinx documentation
      run: |
        uv run sphinx-build -b html --nitpicky --fail-on-warning --keep-going docs docs/_build/html

  coverage:
    name: Combine & check coverage
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade coverage[toml]

      - name: Download data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage, create reports and fail if less than threshold.
        run: |
          python -m coverage combine
          python -m coverage html --skip-empty
          echo '## Test Coverage Report' >> $GITHUB_STEP_SUMMARY
          python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

          # We are working on increasing coverage and don't accept regressions.
          python -m coverage report --fail-under=97

      - name: Upload HTML report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: html-report
          path: .htmlcov
